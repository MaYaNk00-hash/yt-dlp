[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-dlp-studio"
version = "1.0.0"
description = "Clean, modern web studio and dashboard for stream inspection and automated FFmpeg video merging powered by yt-dlp and FastAPI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "yt-dlp>=2024.03.10",
    "websockets>=12.0",
    "pydantic>=2.6.0"
]

[tool.vercel]
entrypoint = "backend.main:app"
